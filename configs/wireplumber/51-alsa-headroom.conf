# raccoon: ALSA output headroom (WirePlumber 0.5 drop-in)
#
# Symptom this fixes: audio crackles / cuts out during gameplay, especially on
# the GPU HDMI output. Root cause is ALSA underruns (xruns) - PipeWire reports
# `api.alsa.headroom = 0` by default, so with the graph negotiated to a small
# quantum (~128) there is zero slack. Any late audio-thread wakeup (GPU under
# load, powersave CPU governor) misses the deadline and you hear a click/gap.
#
# HDMI and USB DACs report imprecise buffer delay, so a fixed headroom is the
# recommended cure. 2048 frames (~43ms at 48kHz) is buffered ahead; it does not
# change perceived latency for games/media and eliminates the dropouts.
#
# Applies to every ALSA sink (HDMI, USB SPDIF/Speaker/Headphones). Verified on
# bragi: xrun ERR counter held at 0 through playback after applying.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 2048
      }
    }
  }
]
