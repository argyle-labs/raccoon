### MangoHud overlay - toggle with Right-Shift + F12
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

## What to show
fps
fps_metrics=avg,0.01,0.1   # live avg + 1% low + 0.1% low = stutter at a glance
frametime=1
frame_timing=1             # frametime graph; tall spikes = stutter
gpu_stats
gpu_temp
gpu_power
cpu_stats
cpu_temp
ram
vram
resolution
refresh_rate

## Logging (tune.sh reads these CSVs)
# output_folder is set per-machine by `./tune.sh enable` (absolute path); left
# unset here so it doesn't drift across boxes. Toggle a capture in-game with
# Shift_L+F2, then run `./tune.sh analyze` (or `./tune.sh watch` for live).
log_duration=0             # 0 = log until you toggle off

## Appearance
position=top-left
font_size=26
background_alpha=0.4
round_corners=8
