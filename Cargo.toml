[package]
name = "raccoon"
version = "0.1.0"
edition = "2024"
description = "Gaming-box diagnostics/repair for orca — audio, CPU power mode, scheduler, GPU, shader cache (Bazzite/CachyOS)"

[package.metadata.orca]
category = "gaming"

[lib]
name = "raccoon"
path = "src/lib.rs"
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets the workspace use it
# as a normal Rust lib. The plugin ships as a `[[bin]]` (see `src/main.rs`) that
# talks to the orca daemon over its Unix socket via `serve_tool_plugin!` from
# plugin-toolkit. No FFI/cdylib.
crate-type = ["rlib"]

[[bin]]
name = "raccoon"
path = "src/main.rs"

# raccoon is a **hybrid** plugin: an (empty) `raccoon.` tool surface plus one
# `diagnostics` domain backend (see `src/registration.rs`). It inspects the local
# gaming box (this plugin runs on the machine it diagnoses) and emits typed
# findings + repairs through orca's diagnostics contract. The orca surface
# (serde_json, the contract::diagnostics types, abi::BackendDef) is reached
# through `plugin_toolkit::*`.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }

# The plugin's hand-written source derives/parses with fully-qualified `serde` /
# `serde_json` paths (config-row parsing, Finding (de)serialization). Pinned to
# the orca workspace major so cargo unifies them with the toolkit's copy into a
# single crate instance — the contract::diagnostics types cross the seam as one.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.7-rc.1" }

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` stays a hard error so the plugin remains portable back into the
# orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
